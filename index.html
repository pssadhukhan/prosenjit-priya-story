<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>৭৩০ দিন: বেরুই থেকে জেজুর, অতঃপর আমরা তিনজন ❤️ | ২য় বিবাহবার্ষিকী</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galada&family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 25%, #360917 0%, #180309 65%, #090104 100%);
      --crimson-deep: #4a0614;
      --crimson-royal: #780d22;
      --crimson-accent: #9e1430;
      --gold-primary: #d4af37;
      --gold-light: #f7e29c;
      --gold-dark: #aa8522;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --parchment: #faf5eb;
      --parchment-shade: #f0e4ce;
      --parchment-border: #decba8;
      --text-dark: #261217;
      --text-muted: #63424a;
      --book-width: min(46vw, 540px);
      --book-height: min(84vh, calc(100dvh - 122px));
      --book-shadow: 0 18px 50px rgba(0, 0, 0, 0.8), 0 6px 18px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-gradient);
      color: #fff;
      font-family: 'Hind Siliguri', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      user-select: none;
    }

    #ambientCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* CINEMATIC VELVET CURTAIN OVERLAY */
    .curtain-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .curtain-left, .curtain-right {
      position: absolute;
      top: 0;
      width: 50.5vw;
      height: 100vh;
      background: repeating-linear-gradient(90deg, #38040d 0px, #5c0919 25px, #8a1228 50px, #4a0613 75px, #2c0209 100px);
      box-shadow: inset 0 0 70px rgba(0,0,0,0.85);
      transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 1;
    }

    .curtain-left { left: 0; border-right: 4px solid var(--gold-primary); }
    .curtain-right { right: 0; border-left: 4px solid var(--gold-primary); }

    .curtain-fringe {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 24px;
      background: repeating-linear-gradient(90deg, var(--gold-dark) 0px, var(--gold-light) 6px, var(--gold-dark) 12px);
    }

    .curtain-opened .curtain-left { transform: translateX(-102%); }
    .curtain-opened .curtain-right { transform: translateX(102%); }
    .curtain-opened .intro-center-card {
      opacity: 0;
      transform: scale(1.12);
      pointer-events: none;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .intro-center-card {
      position: relative;
      z-index: 10;
      background: radial-gradient(circle at 50% 35%, rgba(65, 8, 20, 0.97) 0%, rgba(25, 3, 7, 0.99) 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 450px;
      width: 88%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px var(--gold-glow);
    }

    .intro-seal {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-light), var(--gold-dark));
      margin: 0 auto 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: var(--crimson-royal);
      border: 3px solid #fff;
      box-shadow: 0 0 25px var(--gold-glow);
    }

    .intro-title {
      font-family: 'Galada', cursive;
      font-size: 24px;
      color: var(--gold-light);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .intro-sub { font-size: 13px; color: #ffe0e7; margin-bottom: 12px; }

    .intro-date-badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .intro-tap-btn {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
      color: #38050e;
      border: none;
      padding: 12px 26px;
      border-radius: 35px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 0 25px var(--gold-glow);
      font-family: 'Hind Siliguri', sans-serif;
    }

    /* COMPACT APP HEADER */
    header.app-header {
      width: 100%;
      max-width: 1120px;
      height: 44px;
      padding: 4px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }

    .brand-container { display: flex; align-items: center; gap: 10px; }

    .brand-seal {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-light), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #fff;
      color: var(--crimson-royal);
      font-size: 16px;
    }

    .brand-title {
      font-family: 'Galada', cursive;
      font-size: 17px;
      color: var(--gold-light);
      line-height: 1.2;
    }

    .header-controls { display: flex; align-items: center; gap: 8px; }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: var(--gold-light);
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Hind Siliguri', sans-serif;
    }

    .eq-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; width: 12px; }
    .eq-bar { width: 2px; background: var(--gold-light); border-radius: 1px; height: 3px; }
    .playing .eq-bar:nth-child(1) { animation: eqAnim 0.7s infinite alternate ease-in-out; }
    .playing .eq-bar:nth-child(2) { animation: eqAnim 0.9s 0.2s infinite alternate ease-in-out; }
    .playing .eq-bar:nth-child(3) { animation: eqAnim 0.6s 0.4s infinite alternate ease-in-out; }
    @keyframes eqAnim { 0% { height: 2px; } 100% { height: 12px; } }

    /* TOP INFO BAR */
    .top-info-bar {
      width: 95%;
      max-width: 960px;
      height: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(80, 10, 25, 0.9) 0%, rgba(35, 4, 11, 0.98) 100%);
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 20px;
      padding: 0 12px;
      z-index: 20;
    }

    .milestone-badge-text {
      font-size: 11.5px;
      color: var(--gold-light);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-music-pill {
      font-size: 10.5px;
      color: #ffd8e2;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      white-space: nowrap;
    }

    /* 3D FLIPBOOK STAGE */
    .book-stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 10px;
      perspective: 2600px;
      z-index: 10;
      overflow: hidden;
    }

    .book-container {
      position: relative;
      width: var(--book-width);
      height: var(--book-height);
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @media (min-width: 960px) {
      .book-container.cover-view {
        transform: translateX(0);
      }
      .book-container.spread-view {
        transform: translateX(50%);
      }
    }

    .book-page {
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      will-change: transform;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 6px 16px 16px 6px;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.95s cubic-bezier(0.645, 0.045, 0.355, 1);
      box-shadow: var(--book-shadow);
    }

    .page-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 6px 16px 16px 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .page-back {
      transform: rotateY(180deg);
      border-radius: 16px 6px 6px 16px;
    }

    .page-face::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 28px; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.06) 45%, transparent 100%);
      pointer-events: none;
      z-index: 20;
    }

    .page-back::before {
      left: auto; right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.06) 45%, transparent 100%);
    }

    /* COVER */
    .cover-style {
      background: radial-gradient(circle at 50% 35%, #841427 0%, #4c0714 65%, #2a030a 100%);
      border: 6px solid #200206;
      outline: 2px solid var(--gold-primary);
      outline-offset: -4px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
      position: relative;
    }

    .cover-border-ornament {
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(212, 175, 55, 0.65);
      border-radius: 4px;
      pointer-events: none;
    }

    .cover-mandala {
      width: 74px;
      height: 74px;
      margin: 0 auto 10px auto;
      border-radius: 50%;
      border: 2px double var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--gold-light);
      background: radial-gradient(circle, rgba(212,175,55,0.25), transparent 75%);
    }

    .cover-title {
      font-family: 'Galada', cursive;
      font-size: 24px;
      color: var(--gold-light);
      line-height: 1.3;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      margin-bottom: 8px;
    }

    .cover-subtitle { font-size: 12.5px; color: #ffe0e7; margin-bottom: 10px; }

    .cover-names {
      font-size: 14px;
      color: #fff;
      font-weight: 600;
      background: rgba(0,0,0,0.45);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 25px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      margin-bottom: 12px;
    }

    .cover-cta-btn {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
      color: #38050e;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Hind Siliguri', sans-serif;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    /* STORY CHAPTER PAGES */
    .story-page-style {
      background: #faf5eb;
      background-image: linear-gradient(135deg, #fdfbf7 0%, #faf5eb 60%, #f0e4ce 100%);
      border: 1.5px solid var(--parchment-border);
      color: var(--text-dark);
      padding: 14px 16px 10px 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .page-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      gap: 6px;
    }

    .ch-badge {
      background: linear-gradient(135deg, var(--crimson-royal), var(--crimson-deep));
      color: var(--gold-light);
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--gold-primary);
      white-space: nowrap;
    }

    .ch-date-badge {
      font-size: 10.5px;
      color: var(--crimson-royal);
      font-weight: 600;
      background: rgba(120, 16, 34, 0.08);
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px dashed rgba(120, 16, 34, 0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-title {
      font-family: 'Galada', cursive;
      font-size: 18px;
      color: var(--crimson-deep);
      line-height: 1.28;
      margin-bottom: 4px;
    }

    /* PHOTO STAGE */
    .photo-stage-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      margin: 2px 0 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .polaroid-frame {
      background: #ffffff;
      padding: 6px 6px 8px 6px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(0, 0, 0, 0.1);
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
    }

    .photo-viewport {
      width: 100%;
      flex: 1;
      min-height: 0;
      border-radius: 4px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #300612 0%, #150207 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transition: opacity 0.2s ease;
      filter: contrast(1.05) saturate(1.12) brightness(1.02);
    }

    .photo-count-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(20, 3, 8, 0.88);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid var(--gold-primary);
      z-index: 9;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .zoom-hint-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(20, 3, 8, 0.85);
      color: var(--gold-light);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      z-index: 8;
    }

    .polaroid-caption {
      margin-top: 5px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
      gap: 6px;
    }

    .polaroid-caption-text {
      color: #4a0d1b;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: left;
    }

    .carousel-nav-btn {
      position: absolute;
      top: 44%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(45, 6, 16, 0.9);
      color: var(--gold-light);
      border: 1.5px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      z-index: 12;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }
    .nav-prev { left: 10px; }
    .nav-next { right: 10px; }

    .thumb-dots-container {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
      max-width: 92%;
      flex-wrap: wrap;
    }

    .thumb-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(120, 16, 34, 0.25);
      border: 1px solid rgba(120, 16, 34, 0.5);
      cursor: pointer;
    }

    .thumb-dot.active {
      width: 16px;
      border-radius: 4px;
      background: var(--crimson-royal);
      border-color: var(--gold-primary);
    }

    /* CRISP READABLE STORY TEXT */
    .story-text-container {
      background: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      padding: 8px 11px;
      max-height: 98px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.05);
    }

    .story-text {
      font-size: 13px;
      line-height: 1.58;
      color: #1e0d11;
      font-weight: 500;
      text-align: justify;
    }

    .story-text::first-letter {
      font-family: 'Galada', cursive;
      font-size: 22px;
      float: left;
      margin-right: 5px;
      line-height: 1;
      color: var(--crimson-royal);
    }

    .page-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed rgba(180, 140, 80, 0.45);
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .page-footer-quote {
      font-style: italic;
      color: #7d3646;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 74%;
    }

    .page-number-text {
      font-weight: 700;
      color: var(--crimson-royal);
      font-size: 11px;
    }

    .corner-turn-guide {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 34px;
      height: 34px;
      cursor: pointer;
      z-index: 25;
    }

    .corner-turn-guide::before {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      border-width: 0 0 22px 22px;
      border-style: solid;
      border-color: transparent transparent rgba(212, 175, 55, 0.6) transparent;
    }

    /* LEFT-HAND PAGE */
    .keepsake-back-style {
      background: #f5ebd6;
      background-image: linear-gradient(135deg, #fbf7ee 0%, #f4ead5 50%, #ebdec4 100%);
      color: var(--text-dark);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border: 1.5px solid var(--parchment-border);
      border-radius: 16px 6px 6px 16px;
      overflow: hidden;
    }

    .keepsake-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      margin-bottom: 4px;
      border-bottom: 1px dashed rgba(180, 140, 80, 0.45);
    }

    .keepsake-ch-badge {
      font-family: 'Galada', cursive;
      font-size: 15px;
      color: var(--crimson-deep);
    }

    .keepsake-date-badge {
      font-size: 10px;
      color: #7d4427;
      font-weight: 600;
      background: rgba(212, 175, 55, 0.2);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .keepsake-poem-box {
      background: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-left: 3px solid var(--crimson-royal);
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 6px;
    }

    .keepsake-poem-title {
      font-family: 'Galada', cursive;
      font-size: 14.5px;
      color: var(--crimson-royal);
      margin-bottom: 2px;
    }

    .keepsake-poem-lines {
      font-size: 11.5px;
      line-height: 1.52;
      color: #2b1017;
      font-style: italic;
      margin-bottom: 4px;
    }

    .keepsake-micro-reflection {
      font-size: 10px;
      line-height: 1.4;
      color: #5c333e;
      border-top: 1px dotted rgba(212, 175, 55, 0.45);
      padding-top: 3px;
    }

    .keepsake-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed rgba(180, 140, 80, 0.4);
      font-size: 10px;
      color: #7a4b35;
    }

    .inside-cover-style {
      background: radial-gradient(circle at 50% 40%, #5a0c1a 0%, #30040c 75%, #180206 100%);
      color: #fff;
      padding: 24px 18px;
      border: 6px solid #200206;
      outline: 2px solid var(--gold-primary);
      outline-offset: -4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

    .lightbox-caption {
      margin-top: 10px;

        /* 100% PROMINENT, ULTRA-SMOOTH MOBILE VIEW (60 FPS) */
    @media (max-width: 959px) {
      :root {
        --book-height: min(85dvh, calc(100dvh - 84px));
        --book-width: min(94vw, 440px);
      }

      .book-container {
        transform: none !important;
        perspective: 2000px;
        -webkit-perspective: 2000px;
      }

      .book-page {
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      will-change: transform;
        will-change: transform;
        -webkit-transform-style: preserve-3d;
        transform-style: preserve-3d;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      .book-page.flipped {
        opacity: 0;
        pointer-events: none;
        transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease 0.15s;
      }

      header.app-header { height: 36px; padding: 2px 10px; }
      .brand-title { font-size: 14px; }

      }

      .bottom-bar { height: 38px; padding: 2px 10px; }
      .page-nav-arrow { width: 32px; height: 32px; font-size: 14px; }
    }

    /* ===== নতুন সাজ: কাগজের টেক্সচার, ছবিতে ওয়াশি-টেপ, সোনালি শিরোনাম, তাল-চক্র ===== */
    .story-page-style {
      background-color: #faf5eb;
      background-image:
        linear-gradient(135deg, #fdfbf7 0%, #faf5eb 60%, #f0e4ce 100%);
    }
    .story-page-style::after, .keepsake-back-style::after {
      content: ''; position: absolute; inset: 6px; pointer-events: none; border-radius: 4px;
      border: 1px solid rgba(170, 133, 34, 0.38); z-index: 1;
    }
    .ch-title { background: linear-gradient(100deg, #4a0614 0%, #8a1228 45%, #4a0614 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .polaroid-frame { transform: rotate(-0.7deg); box-shadow: 0 10px 24px rgba(60, 20, 20, 0.25); transition: box-shadow .45s ease; }
    .polaroid-frame::before {
      content: ''; position: absolute; top: -2px; left: 50%; width: 74px; height: 16px; transform: translateX(-50%) rotate(2deg);
      background: repeating-linear-gradient(90deg, rgba(212,175,55,.55) 0 6px, rgba(247,226,156,.55) 6px 12px); border: 1px solid rgba(170,133,34,.4); z-index: 10; pointer-events: none;
    }

    .cover-title {
      background: linear-gradient(100deg, #b8902c 0%, #fff3bd 28%, #d4af37 50%, #fff3bd 72%, #b8902c 100%); background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 2px 5px rgba(0,0,0,.8));
      animation: foilSweep 3.4s ease-out 1.2s 1 both;
    }
    @keyframes foilSweep { from { background-position: 100% 0; } to { background-position: 0 0; } }
    .cover-mandala { box-shadow: 0 0 30px rgba(212,175,55,.35), inset 0 0 18px rgba(212,175,55,.25); }
    .milestone-badge-text { flex: 1; min-width: 0; }
    .music-meta { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 62%; }
    .tal-chip { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--gold-light); background: rgba(0,0,0,.45); border: 1px solid rgba(212,175,55,.4); border-radius: 12px; padding: 1px 8px 1px 3px; white-space: nowrap; flex-shrink: 0; }

    .poem-btn { display: none; background: rgba(120,16,34,.1); border: 1px solid rgba(120,16,34,.4); color: var(--crimson-royal); border-radius: 10px; font-size: 11px; padding: 1px 8px; font-family: 'Hind Siliguri', sans-serif; cursor: pointer; }

    class PetalParticle {

        this.speedX = Math.sin(Math.random() * 6) * 1.2;

        } else {

          ctx.moveTo(0, s * 0.3);
          ctx.bezierCurveTo(-s, -s * 0.6, -s * 1.4, s * 0.5, 0, s * 1.4);
          ctx.bezierCurveTo(s * 1.4, s * 0.5, s, -s * 0.6, 0, s * 0.3);
          ctx.fill();
        } else if (this.kind === 'gold') {
          ctx.fillStyle = '#f7e29c';
          ctx.beginPath();
          ctx.arc(0, 0, this.size * 0.35, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#b3243c';
          ctx.beginPath();
          ctx.moveTo(0, -this.size * 0.5);
          ctx.bezierCurveTo(this.size * 0.6, -this.size * 0.6, this.size * 0.8, this.size * 0.4, 0, this.size);
          ctx.bezierCurveTo(-this.size * 0.8, this.size * 0.4, -this.size * 0.6, -this.size * 0.6, 0, -this.size * 0.5);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function initParticles(count = 28) {
      particles = [];
      for (let i = 0; i < count; i++) {

      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }

    /* MULTI-PHOTO CAROUSEL FUNCTIONS */
    window.changePhoto = function(pageIdx, delta) {
      const item = BOOK_DATA[pageIdx];
      if (!item || !item.photos || item.photos.length <= 1) return;
      const total = item.photos.length;
      const newIdx = (photoIndices[pageIdx] + delta + total) % total;
      setPhotoIndex(pageIdx, newIdx);
    };

    window.setPhotoIndex = function(pageIdx, newIdx) {
      const item = BOOK_DATA[pageIdx];
      if (!item || !item.photos) return;
      photoIndices[pageIdx] = newIdx;
      const photoObj = item.photos[newIdx];

      const imgEl = document.getElementById(`img-slot-${pageIdx}`);
      if (imgEl) {
        imgEl.style.opacity = '0.35';
        const url = getPhotoPath(item.folder, photoObj.file), token = String(Date.now() + Math.random());
        imgEl.dataset.token = token; imgEl.dataset.tries = '';
        const pre = new Image();
        const apply = () => { if (imgEl.dataset.token !== token) return; imgEl.src = url; imgEl.style.opacity = '1'; };
        pre.onload = apply; pre.onerror = apply; pre.src = url;
      }

      const capEl = document.getElementById(`caption-text-${pageIdx}`);
      if (capEl) capEl.textContent = photoObj.caption;

      const pillEl = document.getElementById(`counter-pill-${pageIdx}`);
      if (pillEl) {
        pillEl.textContent = `📸 ছবি ${toBengaliNumber(newIdx + 1)} / ${toBengaliNumber(item.photos.length)}`;
      }

      const dotsContainer = document.getElementById(`dots-${pageIdx}`);
      if (dotsContainer) {
        dotsContainer.querySelectorAll('.thumb-dot').forEach((dot, idx) => {
          dot.classList.toggle('active', idx === newIdx);
        });
      }
    };

    /* 3D FLIPBOOK CONTROLLER */
    function updateBookFlip() {
      for (let i = 0; i < totalPages; i++) {
        const pageEl = document.getElementById(`page-${i}`);
        if (!pageEl) continue;

        if (i < currentPage) {
          pageEl.classList.add('flipped');
          const leftRank = i + 1;
          pageEl.style.zIndex = leftRank;
          pageEl.style.transform = `translate3d(0, 0, ${leftRank * 2}px) rotateY(-180deg)`;
        } else {
          pageEl.classList.remove('flipped');
          const rightRank = totalPages - i;
          pageEl.style.zIndex = rightRank;
          pageEl.style.transform = `rotateY(0deg) translate3d(0, 0, ${rightRank * 2}px)`;
        }
      }

      if (currentPage === 0) {
        bookContainer.classList.add('cover-view');
        bookContainer.classList.remove('spread-view');
      } else {
        bookContainer.classList.remove('cover-view');
        bookContainer.classList.add('spread-view');
      }

      const slider = document.getElementById('pageSlider');
      if (slider) slider.value = currentPage;

      const ind = document.getElementById('pageIndicatorText');
      if (ind) {
        if (currentPage === 0) {
          ind.textContent = `প্রচ্ছদ (পাতা ০ / ২২)`;
        } else if (currentPage === 22) {
          ind.textContent = `বিশেষ চিঠি ও শেষ পাতা (পাতা ২২ / ২২)`;
        } else {
          const ch = BOOK_DATA[currentPage];
          ind.textContent = `অধ্যায় ${ch.chapterNum} (${toBengaliNumber(ch.photos.length)}টি ছবি) • পাতা ${toBengaliNumber(currentPage)} / ২২`;
        }
      }

      document.getElementById('prevPageBtn').style.opacity = currentPage === 0 ? '0.4' : '1';
      document.getElementById('nextPageBtn').style.opacity = currentPage === totalPages - 1 ? '0.4' : '1';
      audioPlayer.switchThemeForPage(currentPage);
      preloadPage(currentPage); preloadPage(currentPage + 1);
    }

    function goToPage(targetPage) {
      if (targetPage < 0) targetPage = 0;
      if (targetPage >= totalPages) targetPage = totalPages - 1;
      if (targetPage === currentPage) return;
      if (!audioPlayer.isPlaying) audioPlayer.start();
      audioPlayer.playPageTurnSound();
      currentPage = targetPage;
      updateBookFlip();
    }

    window.goToPage = goToPage;

    document.getElementById('prevPageBtn').addEventListener('click', () => goToPage(currentPage - 1));
    document.getElementById('nextPageBtn').addEventListener('click', () => goToPage(currentPage + 1));
    document.getElementById('pageSlider').addEventListener('input', (e) => goToPage(parseInt(e.target.value)));

    window.addEventListener('keydown', (e) => {
      if (currentPage === 22 && !isPage18Unlocked) {
        if (e.key >= '0' && e.key <= '9') { enterPinDigit(e.key); return; }
        else if (e.key === 'Backspace') { backspacePin(); return; }
        else if (e.key === 'Escape') { clearPin(); return; }
      }
      if (document.getElementById('lightboxModal').classList.contains('active')) {
        if (e.key === 'ArrowLeft') lbNav(-1);
        if (e.key === 'ArrowRight') lbNav(1);
        if (e.key === 'Escape') closeLightbox();
        return;
      }
      if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
      if (e.key === 'ArrowRight' || e.key === ' ') goToPage(currentPage + 1);
    });

    let touchStartX = 0;
    let touchStartY = 0;
    bookContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    bookContainer.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        const onPhoto = e.target.closest && e.target.closest('.polaroid-frame');
        const it = BOOK_DATA[currentPage];
        if (onPhoto && it && it.photos && it.photos.length > 1) { changePhoto(currentPage, diffX < 0 ? 1 : -1); return; }
        if (diffX < 0) goToPage(currentPage + 1);
        else goToPage(currentPage - 1);
      }
    }, { passive: true });

    /* SECRET PIN LOCK (1711) */
    window.enterPinDigit = function(digit) {
      if (isPage18Unlocked || enteredPin.length >= 4) return;
      enteredPin += digit;
      updatePinDisplay();
      if (enteredPin.length === 4) setTimeout(verifyPin, 200);
    };

    window.backspacePin = function() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDisplay();
      }
    };

    window.clearPin = function() {
      enteredPin = "";
      updatePinDisplay();
    };

    function updatePinDisplay() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`pdot-${i}`);
        if (dot) {
          if (i < enteredPin.length) {
            dot.textContent = "❤️";
            dot.classList.add('filled');
          } else {
            dot.textContent = "•";
            dot.classList.remove('filled');
          }
          dot.classList.remove('error');
        }
      }
    }

    function verifyPin() {
      if (enteredPin === SECRET_PIN) {
        isPage18Unlocked = true;
        audioPlayer.playUnlockSound();
        triggerCelebrationShower();
        const lockScreen = document.getElementById('pinLockScreen');
        if (lockScreen) lockScreen.classList.add('unlocked');
      } else {
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById(`pdot-${i}`);
          if (dot) dot.classList.add('error');
        }
        setTimeout(() => { enteredPin = ""; updatePinDisplay(); }, 600);
      }
    }

    /* CURTAIN */
    const curtainOverlay = document.getElementById('curtainOverlay');
    document.getElementById('openCurtainBtn').addEventListener('click', () => {
      audioPlayer.start();
      audioPlayer.playPageTurnSound();
      curtainOverlay.classList.add('curtain-opened');
      setTimeout(() => { curtainOverlay.style.display = 'none'; }, 1700);
    });

    window.openPoem = function(i) {
      const it = BOOK_DATA[i]; if (!it) return;
      document.getElementById('poemTitle').textContent = '📜 ' + (it.backTitle || '');
      document.getElementById('poemLines').innerHTML = '"' + (it.backPoem || '') + '"';
      document.getElementById('poemRef').textContent = it.backReflection || '';
      document.getElementById('poemModal').classList.add('active');
    };
    document.getElementById('poemModal').addEventListener('click', (e) => { if (e.target.id === 'poemModal') e.target.classList.remove('active'); });
    function preloadPage(i) { const it = BOOK_DATA[i]; if (it && it.photos) it.photos.forEach(p => { const im = new Image(); im.src = getPhotoPath(it.folder, p.file); }); }

    /* TOC */
    const tocModal = document.getElementById('tocModal');
    const tocListContainer = document.getElementById('tocListContainer');

    function buildTOC() {
      tocListContainer.innerHTML = '';
      BOOK_DATA.forEach((item, idx) => {

          meta = 'শেষ পাতা';
        } else {
          label = item.title;
          meta = `${item.date} • ${toBengaliNumber(item.photos.length)}টি ছবি`;
        }
        itemEl.innerHTML = `
          <div class="toc-item-left">
            <div class="toc-item-num">${item.chapterNum || toBengaliNumber(idx)}</div>
            <div>
              <div class="toc-item-title">${label}</div>
              <div class="toc-item-meta">${meta}</div>
            </div>
          </div>
          <span style="color:var(--gold-light);">➔</span>
        `;
        itemEl.addEventListener('click', () => {
          goToPage(idx);
          tocModal.classList.remove('active');
        });
        tocListContainer.appendChild(itemEl);
      });
    }

    document.getElementById('tocBtn').addEventListener('click', () => { buildTOC(); tocModal.classList.add('active'); });
    document.getElementById('tocCloseBtn').addEventListener('click', () => tocModal.classList.remove('active'));
    tocModal.addEventListener('click', (e) => { if (e.target === tocModal) tocModal.classList.remove('active'); });

    /* LIGHTBOX */
    const lbModal = document.getElementById('lightboxModal');
    const lbImg = document.getElementById('lightboxImg');
    const lbCaption = document.getElementById('lightboxCaption');
    let lbPage = 0;
    let lbIdx = 0;

    window.openLightbox = function(pageIdx) {
      const item = BOOK_DATA[pageIdx];
      if (!item || !item.photos || item.photos.length === 0) return;
      lbPage = pageIdx;
      lbIdx = photoIndices[pageIdx] || 0;
      updateLightboxContent();
      lbModal.classList.add('active');
    };

    window.openLightboxToImage = function(pageIdx, photoIdx) {
      const item = BOOK_DATA[pageIdx];
      if (!item || !item.photos || item.photos.length === 0) return;
      lbPage = pageIdx;
      lbIdx = photoIdx;
      updateLightboxContent();
      lbModal.classList.add('active');
    };

    function updateLightboxContent() {
      const item = BOOK_DATA[lbPage];
      const currentPhoto = item.photos[lbIdx];
      lbImg.src = getPhotoPath(item.folder, currentPhoto.file);
      lbCaption.innerHTML = `
        <strong>${currentPhoto.caption || item.title}</strong><br>
        <span style="font-size:11.5px; color:#f7e29c;">অধ্যায় ${item.chapterNum || ''}: ছবি ${toBengaliNumber(lbIdx + 1)} / ${toBengaliNumber(item.photos.length)}</span>
      `;
      const hasMultiple = item.photos.length > 1;
      document.getElementById('lbPrevBtn').style.display = hasMultiple ? 'flex' : 'none';
      document.getElementById('lbNextBtn').style.display = hasMultiple ? 'flex' : 'none';
    }

    function lbNav(delta) {
      const item = BOOK_DATA[lbPage];
      if (!item || item.photos.length <= 1) return;
      lbIdx = (lbIdx + delta + item.photos.length) % item.photos.length;
      updateLightboxContent();
      setPhotoIndex(lbPage, lbIdx);
    }

    function closeLightbox() { lbModal.classList.remove('active'); }

    document.getElementById('lbPrevBtn').addEventListener('click', () => lbNav(-1));
    document.getElementById('lbNextBtn').addEventListener('click', () => lbNav(1));
    document.getElementById('lightboxCloseBtn').addEventListener('click', closeLightbox);
    lbModal.addEventListener('click', (e) => { if (e.target === lbModal || e.target.classList.contains('lightbox-img-wrap')) closeLightbox(); });

    document.getElementById('musicBtn').addEventListener('click', () => audioPlayer.toggle());
    document.getElementById('fsBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    });

    renderBook();
    updateBookFlip();
  </script>
</body>
</html>
